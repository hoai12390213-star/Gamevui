name: Arch Linux Java build

on:
  pull_request:
  push:
    branches: [main, Amethyst-iOS-J25Exp]
  workflow_dispatch:

jobs:
  java:
    name: Package LWJGL on Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm ant git jdk8-openjdk unzip zip

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build LWJGL 3.3.1 Java modules
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk
          export PATH="$JAVA_HOME/bin:$PATH"
          cd lwgjl/lwjgl3-wip-rebase_3.3.1
          mkdir -p bin/classes/generator bin/classes/templates/META-INF modules/lwjgl/lwjglx/src/generated/java
          touch bin/classes/generator/touch.txt bin/classes/generator/generated-touch.txt bin/classes/templates/touch.txt modules/lwjgl/lwjglx/src/generated/java/touch.txt
          yes | ant -Dplatform.linux=true \
            -Dbinding.assimp=false -Dbinding.bgfx=false -Dbinding.cuda=false \
            -Dbinding.egl=false -Dbinding.jawt=false -Dbinding.jemalloc=false \
            -Dbinding.libdivide=false -Dbinding.llvm=false -Dbinding.lmdb=false \
            -Dbinding.lz4=false -Dbinding.meow=false -Dbinding.meshoptimizer=false \
            -Dbinding.nfd=false -Dbinding.nuklear=false -Dbinding.odbc=false \
            -Dbinding.opencl=false -Dbinding.openvr=false -Dbinding.openxr=false \
            -Dbinding.opus=false -Dbinding.par=false -Dbinding.remotery=false \
            -Dbinding.rpmalloc=false -Dbinding.spvc=false -Dbinding.sse=false \
            -Dbinding.tinyexr=false -Dbinding.tootle=false -Dbinding.xxhash=false \
            -Dbinding.yoga=false -Dbinding.zstd=false \
            -Dbuild.type=release/3.3.1 -Djavadoc.skip=true \
            -Dnashorn.args=--no-deprecation-warning compile release || test $? -eq 141
          mkdir -p ../../JavaApp/libs/lwjgl31
          find bin/RELEASE -name '*.jar' ! -name '*-natives-*' ! -name '*-sources.jar' -exec cp {} ../../JavaApp/libs/lwjgl31/ \;

      - name: Verify the LWJGL 3.3.1 runtime modules
        shell: bash
        run: |
          unzip -t JavaApp/libs/lwjgl31/lwjgl.jar
          unzip -t JavaApp/libs/lwjgl31/lwjgl-lwjglx.jar
          unzip -l JavaApp/libs/lwjgl31/lwjgl-lwjglx.jar | grep -q 'org/lwjgl/input/Keyboard.class'
